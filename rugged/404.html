    <title>404 - Page Not Found | Rugged App</title>
    <meta name="description" content="The requested page could not be found on Rugged App.">
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="css/styles.css">

    <script type="text/javascript">
      // SPA subpath router recovery fallback
      (function() {
        var match = window.location.search.match(/[?&]p=([^&]+)/);
        if (match) {
          var route = decodeURIComponent(match[1]);
          window.history.replaceState(null, null, window.location.pathname + route);
        }
      })();
    </script>
</head>
