<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rugged App | Shared Content</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="css/styles.css">
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
        }

        .container {
            max-width: 400px;
            padding: 40px 24px;
        }

        .logo-main {
            font-size: 36px;
            letter-spacing: 6px;
            color: #FFFFFF;
            margin-bottom: 40px;
        }

        .icon {
            width: 72px;
            height: 72px;
            background-color: #8B1A2F1A;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 32px;
            border: 1px solid #8B1A2F33;
        }

        .icon svg {
            width: 32px;
            height: 32px;
            fill: #8B1A2F;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 16px;
            letter-spacing: 1px;
        }

        p {
            color: #CCCCCC;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 48px;
            letter-spacing: 0.5px;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 18px;
            border-radius: 4px;
            text-decoration: none;
            margin-bottom: 16px;
            transition: all 0.2s;
            box-sizing: border-box;
            letter-spacing: 2px;
            font-size: 16px;
            text-transform: uppercase;
        }

        .btn:active {
            transform: scale(0.97);
        }

        .btn-primary {
            background-color: #8B1A2F;
            color: #FFFFFF;
            box-shadow: 0 8px 24px rgba(139, 26, 47, 0.2);
        }

        .footer-text {
            margin-top: 60px;
            font-size: 12px;
            color: #444444;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-main">RUGGED APP</div>

        <div class="icon">
            <svg viewBox="0 0 24 24">
                <path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92s2.92-1.31 2.92-2.92c0-1.61-1.31-2.92-2.92-2.92z"/>
            </svg>
        </div>

        <h1>SHARED TEMPLATE</h1>
        <p>A training protocol or nutritional template has been shared with you. To view and save this content, open it in the Rugged app.</p>

        <a href="javascript:void(0)" onclick="openApp()" class="btn btn-primary">OPEN IN APP</a>

        <div class="footer-text">
            RUGGED APP
        </div>
    </div>

    <script>
        function openApp() {
            window.location.href = window.location.href;
        }
    </script>
</body>
</html>
